<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MicroLIMS</title>
    <style>
      /* Global print rules used by the Inventory "view and print" pages.
         .no-print hides the topbar/subnav/forms/action buttons.
         .print-only holds the pre-filtered (expired/out-of-stock or
         retired equipment excluded) table and is invisible on screen,
         shown only when the browser print dialog is triggered. */
      .print-only { display: none; }
      @media print {
        .no-print { display: none !important; }
        .print-only { display: block !important; }
        body { background: #fff; }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
