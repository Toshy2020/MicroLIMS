<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MicroLIMS</title>
    <style>
      /* Global print rules used by the Inventory "view and print" pages.
         .no-print hides the topbar/subnav/forms/action buttons.
         .print-only holds the pre-filtered table and is invisible on screen,
         shown only when the browser print dialog is triggered. */
      .print-only { display: none; }
      @media print {
        @page {
          size: A4 landscape;
          margin: 10mm 12mm 12mm 12mm;
        }
        * {
          -webkit-print-color-adjust: exact !important;
          print-color-adjust: exact !important;
        }
        html, body, #root, #root > div, main {
          height: auto !important;
          min-height: 0 !important;
          max-height: none !important;
          overflow: visible !important;
          position: static !important;
          background: #fff !important;
        }
        .no-print { display: none !important; }
        .print-only { display: block !important; }
        body { background: #fff !important; }
        table {
          width: 100% !important;
          border-collapse: collapse !important;
        }
        thead {
          display: table-header-group !important;
        }
        tr {
          break-inside: avoid !important;
          page-break-inside: avoid !important;
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
